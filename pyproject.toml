[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codequest"
version = "0.1.0.dev0"
description = "Aprende el proyecto que tú mismo construiste."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "platformdirs>=4.2",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
codequest = "codequest.app.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codequest = ["ui/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
